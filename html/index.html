<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/profiles.css">
    <link rel="stylesheet" href="css/admin.css">
    <title>XS-MultiCharacter</title>
</head>
<body>
    <main id="app" class="hidden">
        <div class="shade" id="shade"></div>
        <header class="pill glass brand" id="brand"></header>
        <div class="pill glass status" id="status"></div>

        <section id="selectView" class="view hidden">
            <aside class="panel glass" id="details"></aside>
            <div class="rail" id="cards"></div>
        </section>

        <section id="createView" class="view hidden">
            <form class="form glass" id="createForm" autocomplete="off"></form>
            <aside class="kitcard glass" id="kit"></aside>
        </section>

        <section id="spawnView" class="view hidden">
            <aside class="panel glass" id="destination"></aside>
            <div class="rail" id="places"></div>
        </section>

        <section id="deleteView" class="overlay hidden"></section>
    </main>

    <section id="arrival" class="arrival hidden"></section>

    <section id="admin" class="admin hidden"></section>

    <script src="js/icons.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
